<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spooler — thread-box revamp v2 (mockup)</title>
<style>
/* ============================================================================
   Spooler · thread-box revamp v2 — interactive mockup
   One box per thread: the details HEADER is the row's default content; the
   chevron appends the facts beneath, flush, in its own surface. Selection
   paints the header tube only. Fixes reported on 0.11.0:
   • details panel floats right of stranded icons, dup header inside → one
     shared header, panel flush underneath (vertical layering).
   • project jams the left margin → sub-head: provider · time | project (right).
   • ⋯ wraps below title into the margin → trailing cluster fixed right on the
     main line (header titles truncate to ONE line).
   • context bar never fills → base fill from used/max always; overlays on top.
   • selection alone = tone only; chevron restores the expand toggle.
   ========================================================================== */

:root {
  --bg: #f4f4f2;
  --card: #ffffff;
  --muted: #f2f2f0;
  --accent: #f0f0ee;
  --active: #e8e8e4;
  --border: #e4e4e0;
  --guide: #d9d9d3;
  --fg: #1b1b18;
  --muted-fg: #74746c;
  --subtle: #a4a49a;
  --primary: #18181b;
  --primary-fg: #f8f8fa;
  --success: #15803d;
  --success-fg: #22a055;
  --warning: #b45309;
  --warning-soft: #fdf4e6;
  --error: #b91c1c;
  --error-soft: #fdeeee;
  --shadow: 0 10px 30px rgb(0 0 0 / 0.10);
  --menu-w: 248px;
}
.dark {
  --bg: #121211;
  --card: #1c1c1a;
  --muted: #232320;
  --accent: #242422;
  --active: #2c2c29;
  --border: #2e2e2b;
  --guide: #3a3a36;
  --fg: #ececeb;
  --muted-fg: #96968d;
  --subtle: #6f6f68;
  --primary: #ececeb;
  --primary-fg: #171719;
  --success: #4ade80;
  --success-fg: #4ade80;
  --warning: #f0a44c;
  --warning-soft: #382a17;
  --error: #f87171;
  --error-soft: #3a1b1b;
  --shadow: 0 12px 34px rgb(0 0 0 / 0.45);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background 160ms ease, color 160ms ease;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
kbd {
  display: inline-block;
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--card);
  color: var(--muted-fg);
  font: 500 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* ---------- page chrome ---------------------------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.topbar .brand { font-weight: 600; letter-spacing: -0.1px; }
.topbar .brand small { color: var(--muted-fg); font-weight: 400; margin-left: 6px; }
.topbar .spacer { flex: 1; }
.topbar .tool {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--muted-fg);
  font-size: 12px;
}
.topbar .tool:hover { color: var(--fg); border-color: var(--guide); }
.topbar .tool.on { color: var(--fg); background: var(--active); }

.shell { max-width: 430px; margin: 22px auto 40px; padding: 0 14px; }
.sidebar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 6px 0 20px;
  overflow: clip;
}

/* ---------- filter header -------------------------------------------------- */
.fh { padding: 8px 10px 0; }
.fh-search {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--muted);
  color: var(--muted-fg);
}
.fh-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--fg); font-size: 13px; }
.fh-b { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.fh-seg {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 3px; border-radius: 8px;
  background: var(--muted); font-size: 12px; color: var(--muted-fg);
}
.fh-seg button { padding: 3px 9px; border-radius: 6px; }
.fh-seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
.fh-group {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: 8px;
  border: 1px solid var(--border);
  color: var(--muted-fg); font-size: 12px;
}
.fh-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted-fg); font-size: 12px;
}
.chip.on { background: var(--active); border-color: transparent; color: var(--fg); }
.chip .c { color: var(--subtle); font-variant-numeric: tabular-nums; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; }
.chip .dot.amber { background: var(--warning); }
.chip .dot.red { background: var(--error); }
.chip .dot.ink { background: var(--fg); }

/* ---------- captions -------------------------------------------------------- */
.g-cap {
  display: flex; align-items: center; gap: 6px;
  min-height: 30px;
  margin: 2px 8px 2px 4px;
  padding: 0 8px 0 4px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--muted-fg);
  user-select: none;
  cursor: pointer;
}
.g-cap:hover { background: var(--accent); color: var(--fg); }
.g-cap .chev { color: var(--subtle); display: grid; place-items: center; }
.g-cap .lbl { color: var(--fg); font-weight: 600; letter-spacing: -0.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-cap .tot { color: var(--subtle); }
.g-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 500;
}
.g-pill.failed { background: var(--error-soft); color: var(--error); }
.g-pill.working { color: var(--success-fg); }
.g-pill.needs { background: var(--warning-soft); color: var(--warning); }

/* ============================================================================
   THE BOX — one per thread.
   Header = the row's default content (provider icon · title / sub-head).
   Tube (hover / selected wash) paints the HEADER ONLY; the details append
   beneath, flush, as their own surface — vertical layering, never squeezed
   into a side-by-side two-tone.
   ========================================================================== */
.box {
  position: relative;
  padding: 1px 8px 1px 2px;
  min-width: 0;
}
.box .axis1, .box .axis2 {
  position: absolute; top: 0; bottom: 0;
  width: 1px; background: var(--guide);
  pointer-events: none;
}
.box .axis1 { left: 26px; }
.box .axis2 { left: 44px; }

/* Header ------------------------------------------------------------ */
.row-head {
  position: relative;
  display: block;
  padding: 2px 8px 2px 0;
  border-radius: 8px;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: pan-y;
  cursor: pointer;
}
.box:hover > .row-head { background: var(--accent); }
/* Selection alone = tone only (no auto-opened details beneath it). */
.box.selected > .row-head { background: var(--active); }
.box.open > .row-head { border-radius: 8px 8px 0 0; }

.prov {
  position: relative;
  z-index: 1;
  display: inline-grid;
  place-items: center;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  color: #fff;
  font: 700 9px/1 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  flex: none;
}
.prov.pi { background: linear-gradient(160deg, #a855f7, #7c3aed); }
.prov.acp { background: linear-gradient(160deg, #2dd4bf, #0d9488); }
/* Provider icon rides over the axis line; guides never hide. */
.box > .row-head > .prov {
  position: absolute;
  top: 8px;
  left: 19px;
}
.member > .box > .row-head > .prov, .kid > .box > .row-head > .prov { left: 37px; }

.spin { display: inline-grid; place-items: center; color: var(--success-fg); animation: rot 1s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.amber { background: var(--warning); animation: pulse 1.6s ease infinite; }
.dot.red { background: var(--error); }
.dot.ink { background: var(--fg); width: 6px; height: 6px; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* Structural lead: status glyph | family fold chevron | selection checkbox,
   sitting right of the provider icon on the main line. */
.lead {
  display: inline-grid;
  place-items: center;
  width: 16px; height: 16px;
  flex: none;
  color: var(--muted-fg);
}
.lead-btn { display: grid; place-items: center; width: 16px; height: 16px; color: var(--subtle); }
.lead-btn:hover { color: var(--fg); }
.gcheck { color: var(--success-fg); }

.head-main {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 22px;
  margin-left: 34px;      /* 26px axis + 8px breathing room; member boxes shift */
}
.member > .box .head-main, .kid > .box .head-main { margin-left: 52px; }
.main .ttl {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.box.unread .ttl { font-weight: 600; }

/* Trailing cluster on the MAIN line — fixed, never wraps into any margin. */
.trail { display: inline-flex; align-items: center; gap: 3px; flex: none; }
.hbtn {
  display: grid; place-items: center;
  width: 20px; height: 20px;
  border-radius: 5px;
  color: var(--subtle);
}
.hbtn:hover { background: var(--state-hover, var(--muted)); color: var(--fg); }
.hbtn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.chev-toggle [data-ic] { transition: transform 160ms ease; display: grid; place-items: center; }
.box.open .chev-toggle [data-ic] { transform: rotate(180deg); }

/* Sub-head: status word · provider · time — and the project RIGHT-justified.
   Always this form, unexpanded and expanded alike, so the outer row never
   duplicates or jams when the details are open. */
.sub {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 18px;
  margin-left: 56px;
  padding-right: 2px;
  font-size: 12px;
  line-height: 1.35;
}
.member > .box .sub, .kid > .box .sub { margin-left: 74px; }
.sub .left { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.sub .word { color: var(--success-fg); font-weight: 500; white-space: nowrap; }
.sub .pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.sub .pill.amber { background: var(--warning-soft); color: var(--warning); }
.sub .pill.red { background: var(--error-soft); color: var(--error); }
.sub .provname { color: var(--muted-fg); white-space: nowrap; }
.sub .sep { color: var(--subtle); }
.sub .ftime { color: var(--subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub .push { flex: 1 1 0; }
.sub .right { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 55%; overflow: hidden; }
.sub .pr { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--muted-fg); white-space: nowrap; flex: none; }
.sub .pr.ok { color: var(--success-fg); }
.sub .pr.warn { color: var(--warning); }
.sub .pr .n { font-weight: 500; }
.sub .prj { color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 8px; border-left: 1px solid var(--border); min-width: 0; flex: 0 1 auto; }

/* ---------- the appended details ------------------------------------------- */
.details {
  position: relative;
  margin: 2px 0 2px;
  padding: 0 12px 10px;
  border-radius: 0 0 8px 8px;
  background: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  animation: drop 150ms ease;
  min-width: 0;
}
.details .sep {
  height: 1px;
  margin: 0 -12px 10px;
  background: var(--border);
}
@keyframes drop { from { opacity: 0; transform: translateY(-3px); } }
.d-dl { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 6px 10px; margin: 0; align-items: start; }
.d-dl dt { color: var(--muted-fg); font-size: 12px; }
.d-dl dt::after { content: ":"; }
.d-dl dd { margin: 0; min-width: 0; color: var(--fg); font-size: 12px; overflow-wrap: anywhere; }
.d-muted { color: var(--muted-fg); }
.d-goal {
  font-size: 11px;
  font-weight: 400;
  line-height: 1.55;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
}
.d-branch { display: flex; align-items: center; gap: 4px; min-width: 0; }
.d-branch .bt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.d-copy { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 4px; color: var(--muted-fg); }
.d-copy:hover { background: var(--active); color: var(--fg); }
.d-copy.copied { color: var(--success-fg); }
.d-prlink { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-weight: 500; color: var(--muted-fg); font-size: 12px; max-width: 100%; overflow: hidden; }
.d-prlink:hover { text-decoration: underline; }
.d-prlink.ok { color: var(--success-fg); }
.d-prlink.warn { color: var(--warning); }
.d-replies { color: var(--muted-fg); font-size: 11px; }

/* the context bar: a base fill from used/max is ALWAYS painted; overlays on top */
.d-bar { position: relative; display: flex; gap: 1px; height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--muted-fg) 16%, transparent); overflow: hidden; }
.d-bar .seg { height: 100%; min-width: 2px; }
.d-bar .seg.used { background: var(--primary); }
.d-bar .seg.reserved { background: color-mix(in srgb, var(--warning) 78%, var(--fg)); }
.d-bar .seg.deferred { background: color-mix(in srgb, var(--muted-foreground) 62%, var(--fg)); }
.d-bar .mark { position: absolute; top: -1px; bottom: -1px; width: 2px; border-radius: 1px; background: var(--warning); }
.d-note { margin: 5px 0 0; font-size: 11px; color: var(--subtle); }
.d-acts { display: flex; gap: 6px; margin-top: 10px; }
.btn-open, .btn-split {
  display: inline-flex; align-items: center; justify-content: center;
  height: 26px; padding: 0 11px;
  border-radius: 6px;
  font-size: 12px; font-weight: 500;
}
.btn-open { background: var(--primary); color: var(--primary-fg); }
.btn-open:hover { filter: brightness(1.08); }
.btn-split { border: 1px solid var(--border); background: transparent; }
.btn-split:hover { background: var(--active); }

/* ---------- spool cards ----------------------------------------------------- */
.spool-head {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  min-height: 30px;
  padding: 3px 8px 3px 2px;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: pan-y;
}
.spool-head:hover { background: var(--accent); }
.member > .box, .kid > .box { padding: 1px 8px 1px 2px; }
.spool-head .axis1 { position: absolute; left: 26px; top: 0; bottom: 0; width: 1px; background: var(--guide); pointer-events: none; }
.spool-head > .spool-glyph {
  position: absolute; top: 50%; transform: translateY(-50%); left: 18px;
  width: 16px; height: 16px;
  display: grid; place-items: center;
  color: var(--muted-fg);
}
.spool-head > .spool-glyph:hover { color: var(--fg); }
.spool-title {
  flex: 1; min-width: 0;
  padding-left: 40px;
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.spool-trail { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.spool-meta { color: var(--muted-fg); font-size: 12px; white-space: nowrap; }
.spool-meta .wd { color: var(--success-fg); }
.spool-pip {
  display: inline-grid; place-items: center; gap: 2px;
  min-width: 20px; height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--muted);
  color: var(--muted-fg);
  font: 500 11px/1 system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  grid-auto-flow: column;
}
.spool-pip .spin { width: 10px; height: 10px; }
.members { position: relative; }
.member { display: block; min-width: 0; }

/* ---------- context menu ---------------------------------------------------- */
.menu {
  position: fixed;
  z-index: 100;
  width: var(--menu-w);
  padding: 5px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  transform-origin: top right;
  animation: pop 110ms ease;
}
.menu.scroll { overflow-y: auto; }
@keyframes pop { from { opacity: 0; transform: scale(0.97) translateY(2px); } }
.menu .mi {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  min-height: 30px;
  padding: 4px 8px;
  border-radius: 6px;
  text-align: left;
  font-size: 13px;
  color: var(--fg);
}
.menu .mi:hover { background: var(--accent); }
.menu .mi.danger { color: var(--error); }
.menu .mi .ic { display: grid; place-items: center; width: 16px; color: var(--muted-fg); flex: none; }
.menu .mi .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .mi .tick { width: 14px; color: var(--subtle); flex: none; }
.menu .hr { height: 1px; background: var(--border); margin: 5px 4px; }
.menu .hd { padding: 3px 8px; font-size: 11px; letter-spacing: 0.02em; color: var(--subtle); text-transform: uppercase; font-weight: 600; }

/* ---------- mobile ---------------------------------------------------------- */
@media (max-width: 640px) {
  .shell { margin: 8px 0 20px; padding: 0 8px; max-width: none; }
  .head-main { margin-left: 30px; }
  .sub { margin-left: 48px; }
  .member > .box .head-main, .kid > .box .head-main { margin-left: 44px; }
  .member > .box .sub, .kid > .box .sub { margin-left: 62px; }
  .fh-chips { gap: 4px; }
}
@media (hover: none) {
  .hintbar {
    display: flex; gap: 8px; align-items: center;
    margin: 0 10px 8px;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--warning-soft);
    color: var(--warning);
    font-size: 12px;
  }
}
@media (hover: hover) { .hintbar { display: none; } }

#toasts { position: fixed; z-index: 120; bottom: 18px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
.toast {
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--primary);
  color: var(--primary-fg);
  font-size: 12px;
  box-shadow: var(--shadow);
  animation: rise 160ms ease;
  max-width: min(86vw, 420px);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.help {
  position: fixed;
  z-index: 101;
  top: 52px;
  right: 12px;
  width: min(370px, calc(100vw - 24px));
  max-height: calc(100dvh - 72px);
  overflow-y: auto;
  padding: 14px 16px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  font-size: 12.5px;
  color: var(--muted-fg);
}
.help h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--subtle); }
.help ul { margin: 0 0 8px; padding-left: 16px; }
.help li { margin: 5px 0; color: var(--fg); }
.help li span { color: var(--muted-fg); }
.help .x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--muted-fg); }
.help .x:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">Spooler <small>— thread-box revamp · v2 mockup</small></span>
  <span class="spacer"></span>
  <button class="tool" id="tallBtn" type="button">Stack 12 sections</button>
  <button class="tool" id="themeBtn" type="button">Theme: light</button>
  <button class="tool" id="helpBtn" type="button">？ How to try</button>
</div>

<main class="shell">
  <aside class="sidebar" aria-label="Spooler thread list (mockup)">
    <div class="fh">
      <div class="fh-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input placeholder="Search" id="q" />
        <kbd>/</kbd>
      </div>
      <div class="fh-b">

/* ============================ icons ======================================= */
const P = {

  layers: '<path d="m12 2 8.5 4.7L12 11.4 3.5 6.7 12 2Z"/><path d="m3.5 12 8.5 4.7 8.5-4.7"/><path d="m3.5 17 8.5 4.7 8.5-4.7"/>',

  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1Z"/>',

function ic(name, size, cls) {
  return '<svg class="' + (cls || "") + '" data-ic width="' + (size || 14) + '" height="' + (size || 14) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[name] + "</svg>";
}

/* ============================ helpers ===================================== */
const byId = (id) => THREADS.find((t) => t.id === id);
const sections = () => (state.tallSections ? SECTIONS_EXTRA.concat(SECTIONS_BASE) : state.sectionOrder.map((id) => ALL_SECTIONS.find((s) => s.id === id)));
const secName = (sid) => (ALL_SECTIONS.find((s) => s.id === sid) || {}).name || "";
const provHtml = (key, withTitle, cls) => {
  const p = PROVIDERS[key] || PROVIDERS.pi;
  return '<span class="prov ' + p.cls + (cls ? " " + cls : "") + '"' + (withTitle ? ' title="Provider: ' + p.name + '"' : "") + ">" + p.glyph + "</span>";
};

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* ============================ chips ======================================= */
function renderChips() {
  let fail = 0, work = 0, unread = 0, need = 0;
  THREADS.forEach((t) => {
    if (t.status === "failed") fail++;
    if (t.status === "runtime" || t.status === "plan") work++;
    if (t.unread) unread++;
    if (t.status === "waiting") need++;
    (t.kids || []).forEach((k) => { if (k.unread) unread += 1; });
  });
  const chips = [
    ["All", null, "on", null],
    ["Needs you", need, null, "amber"],
    ["Failed", fail, null, "red"],
    ["Working", work, null, "spin"],
    ["Unread", unread, null, "ink"],
  ];
  document.getElementById("chips").innerHTML = chips.map(([label, n, on, dot]) =>
    '<span class="chip ' + (on || "") + '" role="radio" aria-checked="' + (on === "on") + '">' +
    (dot === "spin" ? '<span class="spin" style="width:11px;height:11px">' + ic("load", 11) + "</span>" : dot ? '<span class="dot ' + dot + '"></span>' : "") +
    label + (n ? ' <span class="c">' + n + "</span>" : "") +
    "</span>").join("");
}

/* ============================ box rendering ================================ */
function leadNode(t) {
  if (t.kids) {
    return '<button class="lead-btn" data-act="fam" data-id="' + t.id + '" aria-label="Toggle replies" title="Toggle replies">' +
      ic(state.famFolded[t.id] ? "chevR" : "chevD", 14) + "</button>";
  }
  if (t.status === "runtime" || t.status === "plan") {
    return '<span class="lead" title="Working"><span class="spin">' + ic("load", 13) + "</span></span>";
  }
  if (t.status === "failed") return '<span class="lead" style="color:var(--error)" title="Failed">' + ic("xic", 14) + "</span>";
  if (t.status === "waiting") return '<span class="lead" title="Needs you"><span class="dot amber"></span></span>';
  if (t.status === "done") return '<span class="lead gcheck" title="Finished">' + ic("gcheckic", 14) + "</span>";
  return '<span class="lead"></span>';
}

function subHtml(t) {
  const p = PROVIDERS[t.provider] || PROVIDERS.pi;
  const bits = [];
  if (t.status === "waiting") bits.push('<span class="pill amber">Needs you</span>');
  else if (t.status === "failed") bits.push('<span class="pill red">Failed</span>');
  else if (t.status === "runtime" || t.status === "plan") bits.push('<span class="word">' + (t.word || "Working") + "</span>");
  bits.push('<span class="provname" title="Provider">' + p.name + "</span>");
  bits.push('<span class="sep">·</span><span class="ftime">' + t.time + "</span>");
  const right = [];
  if (t.pr) right.push('<a class="pr ' + (t.pr.state === "draft" ? "warn" : "ok") + '" href="#" data-act="pr" data-id="' + t.id + '">' + ic(t.pr.state === "draft" ? "gprd" : "gpr", 11) + '<span class="n">#' + t.pr.num + "</span></a>");
  if (t.project) right.push('<span class="prj" title="Project">' + t.project + "</span>");
  return '<div class="sub"><span class="left">' + bits.join("") + '</span><span class="push"></span><span class="right">' + right.join("") + "</span></div>";
}

function detailsHtml(t) {
  const rows = [];
  if (t.goal) rows.push("<dt>Goal</dt>" + '<dd class="d-goal">' + t.goal + "</dd>");
  rows.push("<dt>Model</dt><dd>" + t.model + '<span class="d-muted"> · effort ' + (t.effort || "—") + "</span></dd>");
  if (t.branch) {
    rows.push('<dt>Branch</dt><dd><span class="d-branch"><span class="bt">' + t.branch + "</span>" +
      '<button class="d-copy' + (t._copied ? " copied" : "") + '" data-act="copy" data-id="' + t.id + '" title="Copy branch">' +
      ic(t._copied ? "check" : "branch", 12) + "</button>" +
      (t.worktree ? ' <span class="d-muted" title="Worktree">⌂</span>' : "") + "</span></dd>");
  }
  if (t.pr) {
    rows.push('<dt>Pull request</dt><dd><a class="d-prlink ' + (t.pr.state === "draft" ? "warn" : "ok") + '" href="#" data-act="pr" data-id="' + t.id + '">' +
      ic(t.pr.state === "draft" ? "gprd" : "gpr", 12) + "<span>#" + t.pr.num + " · " + t.pr.label + "</span></a></dd>");
  }
  if (t.kids) rows.push("<dt>Replies</dt><dd>" + t.kids.map((k) => k.title).join(", ") + "</dd>");
  const ctx = t.ctx;
  if (ctx) {
    const pct = Math.round((ctx.used / ctx.win) * 100);
    const reserved = 4;
    rows.push("<dt>Context</dt>" + '<dd><div class="d-bar" role="img" aria-label="' + pct + '% used">' +
      '<span class="seg used" style="width:' + pct + '%"></span>' +
      '<span class="seg reserved" style="width:' + reserved + '%"></span>' +
      '<span class="mark" style="left:80%"></span></div>' +
      '<p class="d-note">' + fmtK(ctx.used) + " of " + fmtM(ctx.win) + " used" + (ctx.est ? " · estimated" : "") + "</p></dd>");
  }
  return '<div class="details" role="region" aria-label="Thread details">' +
    '<div class="sep"></div>' +
    '<dl class="d-dl">' + rows.join("") + "</dl>" +
    '<div class="d-acts"><button class="btn-open" data-act="open" data-id="' + t.id + '">Open</button>' +
    '<button class="btn-split" data-act="split" data-id="' + t.id + '">Split</button></div></div>';
}
function fmtK(n) { return n >= 1000 ? Math.round(n / 1000) + "k" : "" + n; }
function fmtM(n) { return n >= 1000000 ? (n / 1000000).toFixed(1) + "M" : fmtK(n); }

/* the box: header (default content of every thread box) + appended details */
function threadBoxHtml(t, opts) {
  opts = opts || {};
  const sel = state.selected === t.id;
  const open = !!state.open[t.id];
  const axes = opts.deep ? '<span class="axis2"></span><span class="axis1"></span>' : '<span class="axis1"></span>';
  const readDot = t.unread && t.status !== "failed" ? '<span class="dot ink" title="Unread"></span>' : "";
  return "<div" + ' class="box' + (sel ? " selected" : "") + (open ? " open" : "") + (t.unread ? " unread" : "") + '"' +
    ' data-thread="' + t.id + '" data-press="thread"' + ">" +
    axes +
    '<div class="row-head">' +
      provHtml(t.provider, true) +
      '<div class="head-main">' +
        leadNode(t) +
        '<span class="ttl">' + t.title + "</span>" +
        (readDot ? '<span style="display:inline-grid;place-items:center">' + readDot + "</span>" : "") +
        '<span class="trail">' +
          '<button class="hbtn more" data-act="menu" data-id="' + t.id + '" aria-haspopup="menu" aria-label="Thread actions" title="Actions">' + ic("more", 14) + "</button>" +
          '<button class="hbtn chev-toggle" data-act="toggle" data-id="' + t.id + '" aria-expanded="' + open + '" aria-label="Toggle details" title="Details">' + ic("chevD", 14) + "</button>" +
        "</span>" +
      "</div>" +
      subHtml(t) +
    "</div>" +
    (open ? detailsHtml(t) : "") +
  "</div>";
}

function spoolCardHtml(s) {
  const members = s.members.map(byId).filter(Boolean);
  const work = members.filter((m) => m.status === "runtime").length;
  return '<div class="spool-card" data-spool="' + s.id + '">' +
    '<div class="spool-head" data-press="spool" data-spool="' + s.id + '">' +
      '<span class="axis1"></span>' +
      '<button class="spool-glyph" data-act="openTop" data-id="' + s.id + '" title="Open top thread" aria-label="Open top thread" type="button">' + ic("spool", 15) + "</button>" +
      '<span class="spool-title" title="' + s.label + '">' + s.label + "</span>" +
      '<span class="spool-trail">' +
        '<button class="hbtn" data-act="spoolmenu" data-id="' + s.id + '" aria-haspopup="menu" aria-label="Spool actions" title="Spool actions" type="button">' + ic("more", 14) + "</button>" +
        '<span class="spool-meta">Spool' + (work ? ' · <span class="wd">' + work + " working</span>" : "") + "</span>" +
        '<span class="spool-pip">' + (work ? '<span class="spin">' + ic("load", 10) + "</span>" : "") + members.length + "</span>" +
      "</span>" +
    "</div>" +
    '<div class="members">' + members.map((m) =>
      '<div class="member">' + threadBoxHtml(m, { deep: true }) + "</div>").join("") + "</div>" +
  "</div>";
}

/* ============================ list ======================================== */
function renderList() {
  const out = [];
  const secs = sections();
  secs.forEach((sec) => {
    const roots = THREADS.filter((t) => t.group === sec.id && t.depth === 0 && !t.spool);
    const spools = SPOOLS.filter((s) => s.section === sec.id);
    if (!roots.length && !spools.length) return;
    if (state.secFolded[sec.id]) {
      out.push('<div class="g-cap"><span class="chev">' + ic("chevR", 13) + '</span><span class="lbl">' + sec.name + "</span></div>");
      return;
    }
    const inSec = roots.concat(spools.flatMap((s) => s.members.map(byId))).filter(Boolean);
    const failed = inSec.filter((t) => t.status === "failed").length;
    const working = inSec.filter((t) => t.status === "runtime").length;
    const needs = inSec.filter((t) => t.status === "waiting").length;
    out.push('<div class="g-cap" data-cap="' + sec.id + '">' +
      '<button class="chev" data-act="capfold" data-id="' + sec.id + '" aria-label="Fold section">' + ic("chevD", 13) + "</button>" +
      '<span class="lbl">' + sec.name + "</span>" +
      (inSec.length ? '<span class="tot">' + inSec.length + "</span>" : "") +
      (failed ? '<span class="g-pill failed">' + failed + " failed</span>" : "") +
      (needs ? '<span class="g-pill needs">1 needs you</span>' : "") +
      (working ? '<span class="g-pill working"><span class="spin" style="width:10px;height:10px">' + ic("load", 10) + "</span>" + working + " working</span>" : "") +
    "</div>");
    spools.forEach((s) => out.push(spoolCardHtml(s)));
    roots.forEach((t) => {
      out.push(threadBoxHtml(t));
      if (t.kids && !state.famFolded[t.id]) {
        t.kids.forEach((k) => {
          out.push('<div class="kid"><div class="box" data-thread="' + k.id + '" data-press="thread">' +
            '<span class="axis2"></span><span class="axis1"></span>' +
            '<div class="row-head">' +
              provHtml(k.provider || t.provider, false, "") +
              '<div class="head-main">' +
                '<span class="lead"></span>' +
                '<span class="ttl">' + k.title + "</span>" +
                '<span class="trail">' +
                  '<button class="hbtn more" data-act="menu" data-id="' + k.id + '" aria-haspopup="menu" aria-label="Thread actions" title="Actions">' + ic("more", 14) + "</button>" +
                  '<button class="hbtn chev-toggle" data-act="toggle" data-id="' + k.id + '" aria-expanded="false" aria-label="Toggle details" title="Details">' + ic("chevD", 14) + "</button>" +
                "</span>" +
              "</div>" +
              subHtml(k) +
            "</div>" + (state.open[k.id] ? detailsHtml(k) : "") + "</div></div>");
        });
      }
    });
  });
  document.getElementById("list").innerHTML = out.join("");
  renderChips();
}
function render() { renderList(); }

/* ============================ context menus =============================== */
function menuItemsFor(kind, id) {
  const items = [];
  if (kind === "section") {
    items.push({ label: "Section settings…", icon: "settings", id: "sec-settings" });
    items.push({ label: "New section", icon: "plus", id: "sec-new" });
    return items;
  }
  if (kind === "thread") {
    const t = byId(id) || {};
    const spool = SPOOLS.find((s) => s.members.includes(id));
    items.push({ id: "split", label: "Open in split", icon: "cols" });
    items.push({ id: "pin", label: "Pin", icon: "pin" });
    items.push({ id: "read", label: t.unread ? "Mark as read" : "Mark as unread", icon: "mail" });
    if (t.kids || t.sib) items.push({ id: "famread", label: "Mark family read", icon: "mail" });
    items.push({ id: "rename", label: "Rename…", icon: "edit" });
    items.push({ id: "archive", label: "Archive", icon: "archive" });
    items.push({ id: "delete", label: "Delete…", icon: "trash", danger: true });
    items.push({ hr: true });
    items.push({ header: "Spools" });
    if (spool) items.push({ id: "release", label: "Remove from spool", icon: "listcol" });
    else items.push({ id: "spoolnew", label: "Create Spool from this Thread", icon: "spool" });
    SPOOLS.filter((s) => !spool || s.id !== spool.id).forEach((s) =>
      items.push({ id: "throw:" + s.id, label: s.label, icon: "layers" }));
    items.push({ hr: true });
    items.push({ header: "Move to section" });
    sections().forEach((sec) => {
      const cur = t.spool ? (SPOOLS.find((s) => s.id === t.spool) || {}).section : t.group;
      items.push({ id: "sec:" + sec.id, label: sec.name, icon: "folder", tick: cur === sec.id });
    });
    items.push({ id: "sec:none", label: "No section", icon: "folder" });
    items.push({ hr: true });
    items.push({ id: "copylink", label: "Copy link", icon: "copy" });
    return items;
  }
  if (kind === "spool") {
    const s = SPOOLS.find((x) => x.id === id) || {};
    items.push({ id: "opentop", label: "Open top thread", icon: "spool" });
    items.push({ hr: true });
    items.push({ header: "Move all to section" });
    sections().forEach((sec) => items.push({ id: "sec:" + sec.id, label: sec.name, icon: "folder", tick: s.section === sec.id }));
    items.push({ id: "sec:none", label: "No section", icon: "folder" });
    items.push({ hr: true });
    items.push({ id: "spoolarchive", label: "Archive Spool Threads", icon: "archive" });
    items.push({ id: "unspool", label: "Unspool threads…", icon: "listcol", danger: true });
    return items;
  }
  return [];
}

function openMenu(kind, id, x, y) {
  state.menu = { kind, id, x, y };
  drawMenu();
}
function closeMenu() { state.menu = null; document.getElementById("menuRoot").innerHTML = ""; }

function drawMenu() {
  const root = document.getElementById("menuRoot");
  if (!state.menu) { root.innerHTML = ""; return; }
  const { kind, id, x, y } = state.menu;
  const items = menuItemsFor(kind, id);
  const html = items.map((it) => {
    if (it.hr) return '<div class="hr" role="separator"></div>';
    if (it.header) return '<div class="hd">' + it.header + "</div>";
    return '<button class="mi' + (it.danger ? " danger" : "") + '" type="button" role="menuitem" data-mi="' + it.id + '">' +
      '<span class="ic">' + ic(it.icon || "plus", 14) + "</span>" +
      '<span class="lb">' + it.label + "</span>" +
      '<span class="tick">' + (it.tick ? ic("check", 13) : "") + "</span></button>";
  }).join("");
  root.innerHTML = '<div class="menu" role="menu" aria-label="Actions">' + html + "</div>";
  const el = root.firstElementChild;
  const margin = 8;
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.min(Math.max(margin, x), Math.max(margin, vw - w - margin));
  let top = Math.min(y, vh - margin - h);
  if (top < margin) {
    top = margin;
    el.style.maxHeight = (vh - margin * 2) + "px";
    el.classList.add("scroll");
  }
  el.style.left = Math.round(left) + "px";
  el.style.top = Math.round(top) + "px";
}
document.addEventListener("pointerdown", (e) => {
  if (!state.menu) return;
  const m = document.querySelector(".menu");
  if (m && !m.contains(e.target)) closeMenu();
}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.menu) { closeMenu(); e.stopPropagation(); } }, true);
window.addEventListener("resize", () => { if (state.menu) drawMenu(); });
document.addEventListener("scroll", () => { if (state.menu) closeMenu(); }, true);

function onMenuItem(miId) {
  const { kind, id } = (state.menu || {});
  closeMenu();
  if (miId === "split") { toast("Open in split — would dock a split pane"); return; }
  if (miId === "pin") { toast("Pin state toggled"); return; }
  if (miId === "read") { const t = byId(id); if (t) { t.unread = !t.unread; render(); } toast(t && t.unread ? "Marked unread" : "Marked read"); return; }
  if (miId === "famread") { toast("Mark family read (whole tree)"); return; }
  if (miId === "rename") { toast("Rename — inline edit would start"); return; }
  if (miId === "archive") { toast("Archive — routes through BB's own confirm"); return; }
  if (miId === "delete") { toast("Delete… — host confirmation"); return; }
  if (miId === "release") {
    const t = byId(id);
    t.spool = undefined; t.group = "progress"; t.depth = 0;
    SPOOLS.forEach((s) => { s.members = s.members.filter((m) => m !== id); });
    render(); toast("Removed from spool"); return;
  }
  if (miId === "spoolnew") { toast("Spool created from this thread"); return; }
  if (miId.startsWith("throw:")) { toast("Thrown onto " + (SPOOLS.find((x) => x.id === miId.slice(6)) || {}).label); return; }
  if (miId === "sec:none") { moveThreadSec(kind, id, null); return; }
  if (miId.startsWith("sec:")) { moveThreadSec(kind, id, miId.slice(4)); return; }
  if (miId === "copylink") { toast("Link copied to clipboard"); return; }
  if (miId === "opentop") { toast("Opens the spool's lead thread"); return; }
  if (miId === "spoolarchive") { toast("Archived every member (bulk, tolerant)"); return; }
  if (miId === "unspool") {
    const s = SPOOLS.find((x) => x.id === id);
    s.members.forEach((mid) => {
      const t = byId(mid);
      if (t) { t.spool = undefined; t.group = s.section; t.depth = 0; t.project = t.project || "mtc"; }
    });
    SPOOLS.splice(SPOOLS.indexOf(s), 1);
    render(); toast("Unspooled — memberships cleared"); return;
  }
  if (miId === "sec-settings") { toast("Section settings… modal"); return; }
  if (miId === "sec-new") { toast("New section form"); return; }
}
function moveThreadSec(kind, id, secId) {
  if (kind === "spool") {
    const s = SPOOLS.find((x) => x.id === id);
    s.section = secId;
    toast("Moved all to " + (secName(secId) || "no section"));
  } else {
    const t = byId(id);
    if (t.spool) { const s = SPOOLS.find((x) => x.id === t.spool); if (s) s.section = secId; }
    else t.group = secId;
    toast("Moved to " + (secName(secId) || "no section"));
  }
  render();
}

/* ============================ long-press ================================== */
const lp = { timer: null, x: 0, y: 0, suppressClick: false };
document.getElementById("list").addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const host = e.target.closest("[data-press]");
  if (!host) return;
  if (e.target.closest(".hbtn") || e.target.closest("[data-act]") || e.target.closest(".details")) return;
  lp.x = e.clientX; lp.y = e.clientY;
  const ms = e.pointerType === "mouse" ? 550 : 450;
  lp.timer = setTimeout(() => {
    lp.timer = null;
    const data = host.dataset;
    if (data.press !== "thread" && data.press !== "spool") return;
    lp.suppressClick = true;
    if (data.press === "spool") openMenu("spool", data.spool, e.clientX, e.clientY);
    else openMenu("thread", data.thread, e.clientX, e.clientY);
    if (navigator.vibrate) navigator.vibrate(10);
  }, ms);
}, true);
document.addEventListener("pointermove", (e) => {
  if (lp.timer && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 8) {
    clearTimeout(lp.timer); lp.timer = null;
  }
}, true);
["pointerup", "pointercancel"].forEach((ev) =>
  document.addEventListener(ev, () => { if (lp.timer) { clearTimeout(lp.timer); lp.timer = null; } }, true));

/* ============================ list interactions ============================ */
document.getElementById("list").addEventListener("click", (e) => {
  if (lp.suppressClick) { lp.suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    const actId = act.dataset.act, id = act.dataset.id;
    e.preventDefault();
    e.stopPropagation();
    if (actId === "menu") { const r = act.getBoundingClientRect(); openMenu("thread", id, r.left, r.bottom + 6); }
    else if (actId === "spoolmenu") { const r = act.getBoundingClientRect(); openMenu("spool", id, r.left, r.bottom + 6); }
    else if (actId === "toggle") { state.open[id] = !state.open[id]; render(); }
    else if (actId === "fam") { state.famFolded[id] = !state.famFolded[id]; render(); }
    else if (actId === "capfold") { state.secFolded[id] = !state.secFolded[id]; render(); }
    else if (actId === "copy") {
      const t = byId(id);
      const done = () => { t._copied = true; render(); setTimeout(() => { t._copied = false; render(); }, 1400); toast("Copied branch: " + t.branch); };
      if (navigator.clipboard && t.branch) navigator.clipboard.writeText(t.branch).then(done, () => toast("Could not copy branch"));
      else done();
    }
    else if (actId === "pr") { const t = byId(id); toast("Opens PR #" + (t && t.pr ? t.pr.num : "?") + " in the browser"); }
    else if (actId === "open") { const t = byId(id); toast("Opening “" + t.title + "”"); }
    else if (actId === "split") { const t = byId(id); toast("Opening “" + t.title + "” in a split pane"); }
    else if (actId === "openTop") { toast("Opens the spool's lead thread"); }
    return;
  }
  if (e.target.closest(".details")) return;
  const head = e.target.closest('[data-press="thread"],[data-press="spool"]');
  if (!head || head.dataset.press === "cap") { if (head && head.dataset.press === "cap") return; }
  if (head && head.dataset.press === "thread") {
    state.selected = state.selected === head.dataset.thread ? null : head.dataset.thread;
    render();
  } else if (head && head.dataset.press === "spool") {
    const s = SPOOLS.find((x) => x.id === head.dataset.spool);
    state.selected = state.selected && s.members.includes(state.selected) ? null : s.members[0];
    render();
  }
});
document.getElementById("list").addEventListener("contextmenu", (e) => {
  const head = e.target.closest('[data-press="thread"],[data-press="spool"]');
  if (!head) return;
  e.preventDefault();
  const data = head.dataset;
  if (data.press === "spool") openMenu("spool", data.spool, e.clientX, e.clientY);
  else openMenu("thread", data.thread, e.clientX, e.clientY);
});

/* ============================ top bar ===================================== */
document.getElementById("themeBtn").addEventListener("click", (e) => {
  state.theme = state.theme === "light" ? "dark" : "light";
  document.documentElement.classList.toggle("dark", state.theme === "dark");
  e.currentTarget.textContent = "Theme: " + state.theme;
});
document.getElementById("tallBtn").addEventListener("click", (e) => {
  state.tallSections = !state.tallSections;
  e.currentTarget.classList.toggle("on", state.tallSections);
  render();
});
document.getElementById("helpBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const root = document.getElementById("helpRoot");
  if (root.innerHTML) { root.innerHTML = ""; return; }
  root.innerHTML = '<div class="help" id="helpPop">' +
    '<button class="x" id="helpX" type="button">' + ic("xplain", 14) + "</button><h4>What's new in v2</h4><ul>" +
    "<li><b>The details header IS the row.</b> Every thread box reads provider icon · title over provider · time — and the project sits <span>right-justified in the sub-head</span>, in both states. Nothing jams the left margin any more.</li>" +
    "<li><b>The chevron is back</b>, upper-right of the box: it appends the details flush <span>underneath</span> the header (visible hairline separator) — they never float beside it, and nothing duplicates.</li>" +
    "<li><b>Selecting no longer opens details</b> — a selected box is just the <span>wash on the header tube</span>; the details surface stays vertically beneath it. No two-tone side strip.</li>" +
    "<li><b>⋯ and ⌄ live on the main line, fixed right</b> — header titles truncate to one line, so the cluster can never wrap into the margin; right-click (and press-and-hold) work with the details open.</li>" +
    "<li><b>The context bar is always filled</b> — a base fill from used/max, tone overlays on top, auto-compact tick at 80%.</li>" +
    "<li>Facts when expanded: Goal (3 lines), Model · effort, Branch (copy), Pull request, Replies, Context. No Status/Provider/Section rows — the sub-head carries them.</li>" +
    "</ul></div>";
  document.getElementById("helpX").addEventListener("click", () => { root.innerHTML = ""; });
  document.addEventListener("click", function closer(ev) {
    if (!ev.target.closest("#helpPop") && !ev.target.closest("#helpBtn")) { root.innerHTML = ""; document.removeEventListener("click", closer); }
  });
});

/* ============================ boot ======================================== */
render();
</script>
</body>
</html>
